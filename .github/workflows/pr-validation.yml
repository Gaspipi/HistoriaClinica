name: PR validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HistoriaClinica.sln

      - name: Build
        run: dotnet build HistoriaClinica.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HistoriaClinica.sln --configuration Release --no-build

      - name: Coverage
        run: dotnet test HistoriaClinica.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger:"console;verbosity=detailed"
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            **/coverage.cobertura.xml
            **/TestResults/**
        if: always()

      - name: Vulnerability scan
        run: dotnet list HistoriaClinica.sln package --vulnerable --include-transitive
        continue-on-error: true
