name: Windows signed release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Crear el tag y publicar la GitHub Release al terminar"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'HistoriaClinica' }}
      SIGNPATH_SIGNING_POLICY_SLUG: release-signing
      SIGNPATH_APP_CONFIGURATION_SLUG: historia-clinica-app
      SIGNPATH_INSTALLER_CONFIGURATION_SLUG: historia-clinica-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar rama main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
              throw "La release firmada solo se puede generar desde main."
          }

      - name: Verificar configuración de SignPath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
              throw "Falta el secret SIGNPATH_API_TOKEN."
          }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) {
              throw "Falta la variable SIGNPATH_ORGANIZATION_ID."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "Hash inválido para Inno Setup: $actualHash"
          }

          $process = Start-Process -FilePath $installer `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
              -Wait -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Falló la instalación de Inno Setup con código $($process.ExitCode)."
          }

      - name: Instalar rcedit
        shell: pwsh
        run: |
          $url = "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          $expectedHash = "3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a"
          $rcedit = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"

          Invoke-WebRequest -Uri $url -OutFile $rcedit
          $actualHash = (Get-FileHash -LiteralPath $rcedit -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "Hash inválido para rcedit: $actualHash"
          }

          "RCEDIT_PATH=$rcedit" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore HistoriaClinica.sln

      - name: Test
        run: dotnet test HistoriaClinica.sln --configuration Release --no-restore

      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $version = (& dotnet msbuild src/HistoriaClinica.App/HistoriaClinica.App.csproj `
              -getProperty:Version -nologo | Select-Object -Last 1).Trim()
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
              throw "Versión inválida: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $version"

      - name: Publicar aplicación
        shell: pwsh
        run: ./installer/build-installer.ps1 -SkipInstaller

      - name: Subir ejecutable sin firmar
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: historia-clinica-app-unsigned-${{ github.run_attempt }}
          path: artifacts/publish/win-x64/HistoriaClinica.exe
          if-no-files-found: error
          retention-days: 1

      - name: Firmar ejecutable con SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_APP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed-app
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Instalar ejecutable firmado
        shell: pwsh
        run: |
          $signed = Get-ChildItem artifacts/signed-app -Recurse -Filter HistoriaClinica.exe |
              Select-Object -First 1
          if (-not $signed) {
              throw "SignPath no devolvió HistoriaClinica.exe."
          }
          Copy-Item -LiteralPath $signed.FullName `
              -Destination artifacts/publish/win-x64/HistoriaClinica.exe -Force

      - name: Compilar instalador con ejecutable firmado
        shell: pwsh
        run: ./installer/build-installer.ps1 -SkipPublish

      - name: Normalizar metadatos del instalador
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "artifacts/installer/HistoriaClinica-$env:VERSION-setup.exe"
          & $env:RCEDIT_PATH $setup `
              --set-version-string ProductName "Historia Clínica" `
              --set-product-version $env:VERSION `
              --set-file-version $env:VERSION
          if ($LASTEXITCODE -ne 0) {
              throw "Falló rcedit con código $LASTEXITCODE."
          }

      - name: Verificar metadatos de producto
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $files = @(
              "artifacts/publish/win-x64/HistoriaClinica.exe",
              "artifacts/installer/HistoriaClinica-$version-setup.exe"
          )

          foreach ($file in $files) {
              $path = (Resolve-Path -LiteralPath $file).Path
              $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
              if ($info.ProductName -ne "Historia Clínica") {
                  throw "ProductName inesperado en ${file}: '$($info.ProductName)'"
              }
              if ($info.ProductVersion -ne $version) {
                  throw "ProductVersion inesperada en ${file}: '$($info.ProductVersion)'"
              }
              if ($info.FileVersion -ne $version) {
                  throw "FileVersion inesperada en ${file}: '$($info.FileVersion)'"
              }
              Write-Host "$file -> $($info.ProductName) $($info.ProductVersion) $($info.FileVersion)"
          }

      - name: Subir instalador sin firmar
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: historia-clinica-installer-unsigned-${{ github.run_attempt }}
          path: artifacts/installer/HistoriaClinica-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Firmar instalador con SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed-installer
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Verificar firmas y generar checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $app = "artifacts/publish/win-x64/HistoriaClinica.exe"
          $setup = "artifacts/installer/HistoriaClinica-$version-setup.exe"

          $signedSetup = Get-ChildItem artifacts/signed-installer -Recurse -Filter "HistoriaClinica-$version-setup.exe" |
              Select-Object -First 1
          if (-not $signedSetup) {
              throw "SignPath no devolvió el instalador firmado."
          }

          Copy-Item -LiteralPath $signedSetup.FullName -Destination $setup -Force
          Remove-Item -LiteralPath "$setup.sha256" -Force -ErrorAction SilentlyContinue

          foreach ($file in @($app, $setup)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              Write-Host "$file -> $($signature.Status) / $($signature.SignerCertificate.Subject)"
              if ($signature.Status -ne "Valid") {
                  throw "Firma inválida para $file ($($signature.Status))."
              }
              if ($signature.SignerCertificate.Subject -notlike "*SignPath Foundation*") {
                  throw "Firmante inesperado para ${file}: $($signature.SignerCertificate.Subject)"
              }
          }

          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$setup.sha256" -Encoding ascii `
              -Value "$hash  $(Split-Path -Leaf $setup)"
          Write-Host "SHA256: $hash"

      - name: Subir artefactos firmados
        uses: actions/upload-artifact@v4
        with:
          name: HistoriaClinica-windows-signed-${{ github.run_attempt }}
          path: |
            artifacts/installer/HistoriaClinica-*-setup.exe
            artifacts/installer/HistoriaClinica-*-setup.exe.sha256
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $tag = "v$version"

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              throw "La release $tag ya existe."
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
              throw "El tag $tag ya existe."
          }

          $notes = @(
              "## Historia Clínica $version"
              ""
              "Instalador de Windows por usuario. Incluye el ejecutable firmado y el instalador firmado con Authenticode."
              ""
              "**Firma de código:** provista por SignPath.io, certificado de SignPath Foundation. Ver la [code signing policy](https://github.com/Gaspipi/HistoriaClinica/blob/main/CODE_SIGNING_POLICY.md)."
              ""
              "Verificá la descarga con el archivo ``.sha256`` adjunto o con ``Get-AuthenticodeSignature`` en Windows."
          ) -join "`n"
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8

          gh release create $tag `
              "artifacts/installer/HistoriaClinica-$version-setup.exe" `
              "artifacts/installer/HistoriaClinica-$version-setup.exe.sha256" `
              --title "Historia Clínica $version" `
              --notes-file release-notes.md `
              --target $env:GITHUB_SHA
