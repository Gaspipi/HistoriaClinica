name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HistoriaClinica.sln

      - name: Test
        run: dotnet test HistoriaClinica.sln --configuration Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "Hash inválido para Inno Setup: $actualHash"
          }

          $process = Start-Process -FilePath $installer `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
              -Wait -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Falló la instalación de Inno Setup con código $($process.ExitCode)."
          }

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Configuration Release

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: HistoriaClinica-windows-installer
          path: artifacts/installer/*
